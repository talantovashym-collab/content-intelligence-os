[project]
name = "content-intelligence-backend"
version = "0.1.0"
description = "Content Intelligence OS Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "python-jose[cryptography]==3.3.0",
    # Fernet encryption for users' stored AI provider keys
    "cryptography>=42",
    "passlib[bcrypt]==1.7.4",
    # passlib 1.7.4 breaks on bcrypt>=4.1 (removed __about__, 72-byte check in its self-test)
    "bcrypt==4.0.1",
    "email-validator==2.1.0",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.30",
    "alembic==1.13.0",
    "asyncpg==0.29.0",
    "pgvector==0.2.5",
    "redis==6.2.0",
    "celery==5.3.0",
    "httpx==0.27.0",
    "ffmpeg-python==0.2.0",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "prometheus-client==0.19.0",
    "sentry-sdk==1.43.0",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "faker==25.1.0",
    "python-dotenv==1.0.0",
    # LLM providers used by creative strategy / production studio generation
    "openai==1.30.0",
    "anthropic==0.25.0",
    # YouTube/TikTok search, metadata and captions without platform API keys.
    # Unpinned upper bound on purpose: sites change and old releases stop working.
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
media-processing = [
    "opencv-python-headless==4.9.0.80",
    "pytesseract==0.3.10",
    "openai-whisper==20231117",
    "librosa==0.10.1",
    "scenedetect==0.6.2",
    "moviepy==1.0.3",
]
ai-providers = [
    "elevenlabs==0.2.0",
    "google-generativeai==0.7.0",
]

[tool.uv]
dev-dependencies = [
    "ruff==0.4.0",
    "mypy==1.10.0",
    "black==24.3.0",
    "isort==5.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true